; Konfigurace přenosného PHP pro aplikaci Domácí rozpočet
; Tento soubor je součástí přenosné aplikace - neupravujte, pokud nevíte co děláte.

extension_dir = "ext"

extension=pdo_sqlite
extension=sqlite3
extension=zip
extension=gd
extension=mbstring
extension=fileinfo
extension=openssl

date.timezone = "Europe/Prague"
default_charset = "UTF-8"

memory_limit = 256M
max_execution_time = 60
post_max_size = 32M
upload_max_filesize = 25M
max_file_uploads = 20

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
error_log = "data/php_errors.log"

; Bezpecnost - lokalni aplikace, ale zakazujeme nebezpecne funkce
expose_php = Off
